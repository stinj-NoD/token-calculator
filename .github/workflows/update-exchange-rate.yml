name: Update USD->EUR exchange rate

on:
  schedule:
    # Tous les jours à 06:00 UTC (les taux BCE sont publiés vers 16h CET la veille).
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le taux USD->EUR et mettre à jour les fichiers si besoin
        run: node scripts/update-exchange-rate.js

      - name: Vérifier la synchronisation providers.json / FALLBACK_DATA
        run: node scripts/check-fallback-sync.js

      - name: Committer si le taux a changé
        run: |
          if git diff --quiet; then
            echo "Aucun changement à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/providers.json index.html
          git commit -m "chore: met à jour le taux de change USD->EUR"
          git push
